  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .blink { animation: ftBlink 1s steps(1, end) infinite; }
    @keyframes ftBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <g clip-path="url(#ftClip)">
    <rect width="900" height="110" fill="url(#ftBg)"/>
    <line x1="0" y1="74" x2="900" y2="74" stroke="#1e293b" stroke-width="0.9"/>
    <line x1="0" y1="88" x2="900" y2="88" stroke="#1e293b" stroke-width="0.9" opacity="0.7"/>
    <line x1="0" y1="102" x2="900" y2="102" stroke="#1e293b" stroke-width="0.9" opacity="0.5"/>
    <line x1="450" y1="74" x2="450" y2="110" stroke="#1e293b" stroke-width="0.9"/>
    <line x1="350" y1="74" x2="260" y2="110" stroke="#1e293b" stroke-width="0.9"/>
    <line x1="550" y1="74" x2="640" y2="110" stroke="#1e293b" stroke-width="0.9"/>
    <line x1="250" y1="74" x2="90" y2="110" stroke="#1e293b" stroke-width="0.9"/>
    <line x1="650" y1="74" x2="810" y2="110" stroke="#1e293b" stroke-width="0.9"/>

    <rect x="0" y="73" width="900" height="2" fill="url(#ftLine)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <circle cx="450" cy="74" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2">
      <animate attributeName="r" values="3;26;3" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0;0.85" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="74" r="3" fill="#38bdf8"/>

    <text x="444" y="34" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">AADI SHARMA  //  END OF TRANSMISSION</text>
    <text x="450" y="54" fill="#64748b" font-size="10" text-anchor="middle" letter-spacing="1.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">AADISHARMA.XYZ  ·  GITHUB.COM/AADISHARMA1  ·  ORCID 0009-0003-9724-0552</text>
    <rect x="612" y="24" width="7" height="12" fill="#38bdf8" class="blink"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="109" rx="12" fill="none" stroke="#1e293b"/>
