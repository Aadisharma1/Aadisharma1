<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" width="900" height="276" role="img" aria-label="Systems Stack and Compute Architecture">
  <defs>
    <linearGradient id="stkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <filter id="stkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
  </style>

  <!-- Dual-Theme Dark Header Pill -->
  <rect x="0.5" y="0.5" width="899" height="30" rx="8" fill="#090d16" stroke="#1e293b"/>
  <circle cx="16" cy="15.5" r="3" fill="#a78bfa"/>
  <text x="28" y="19.5" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.8" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">03 // SYSTEMS STACK &amp; MULTI-GPU COMPUTE ARCHITECTURE</text>
  <text x="884" y="19.5" fill="#64748b" font-size="9.5" text-anchor="end" letter-spacing="1.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">PIPELINE FLOW · ACTIVE</text>

  <!-- Main Frame -->
  <rect x="0.5" y="40.5" width="899" height="235" rx="12" fill="url(#stkBg)" stroke="#1e293b"/>

  <!-- Connecting Animated Circuit Traces Between Columns -->
  <line x1="206" y1="158" x2="238" y2="158" stroke="#1e3a5f" stroke-width="1.5"/>
  <line x1="432" y1="158" x2="464" y2="158" stroke="#1e3a5f" stroke-width="1.5"/>
  <line x1="658" y1="158" x2="690" y2="158" stroke="#1e3a5f" stroke-width="1.5"/>

  <g transform="translate(206,158)"><circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#stkGlow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M 0 0 L 32 0"/></circle></g>
  <g transform="translate(432,158)"><circle cx="0" cy="0" r="3" fill="#a78bfa" filter="url(#stkGlow)"><animateMotion dur="1.4s" begin="0.45s" repeatCount="indefinite" path="M 0 0 L 32 0"/></circle></g>
  <g transform="translate(658,158)"><circle cx="0" cy="0" r="3" fill="#34d399" filter="url(#stkGlow)"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M 0 0 L 32 0"/></circle></g>

  <!-- STAGE 1: LANGUAGES -->
  <g transform="translate(18, 58)">
    <rect width="188" height="198" rx="8" fill="#0c1220" stroke="#1e293b"/>
    <text x="14" y="24" fill="#38bdf8" font-size="9.5" font-weight="700" letter-spacing="1.3" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">01 // LANGUAGES</text>
    <line x1="14" y1="33" x2="174" y2="33" stroke="#1e293b"/>
    <g transform="translate(14, 46)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono" font-size="10.5" fill="#e2e8f0">
      <rect width="74" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="37" y="16" text-anchor="middle">Python</text>
      <rect x="84" width="76" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="122" y="16" text-anchor="middle">C / C++</text>
      <rect y="34" width="88" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="44" y="50" text-anchor="middle">TypeScript</text>
      <rect x="98" y="34" width="62" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="129" y="50" text-anchor="middle">SQL</text>
      <rect y="68" width="74" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="37" y="84" text-anchor="middle">Java</text>
      <rect x="84" y="68" width="76" height="24" rx="4" fill="#111a2c" stroke="#23344f"/><text x="122" y="84" text-anchor="middle">Bash</text>
      <rect y="102" width="160" height="24" rx="4" fill="#0b1525" stroke="#1e3a5f"/><text x="80" y="118" text-anchor="middle" fill="#38bdf8">CUDA · LaTeX</text>
    </g>
  </g>

  <!-- STAGE 2: ML & POST-TRAINING -->
  <g transform="translate(238, 58)">
    <rect width="194" height="198" rx="8" fill="#0c1220" stroke="#1e293b"/>
    <text x="14" y="24" fill="#a78bfa" font-size="9.5" font-weight="700" letter-spacing="1.3" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">02 // ML &amp; CRYPTO</text>
    <line x1="14" y1="33" x2="180" y2="33" stroke="#1e293b"/>
    <g transform="translate(14, 46)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono" font-size="10.5" fill="#e2e8f0">
      <rect width="78" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="39" y="16" text-anchor="middle">PyTorch</text>
      <rect x="86" width="80" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="126" y="16" text-anchor="middle">DeepSpeed</text>
      <rect y="34" width="88" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="44" y="50" text-anchor="middle">RLVR/RLHF</text>
      <rect x="96" y="34" width="70" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="131" y="50" text-anchor="middle">vLLM</text>
      <rect y="68" width="96" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="48" y="84" text-anchor="middle">TenSEAL FHE</text>
      <rect x="104" y="68" width="62" height="24" rx="4" fill="#151228" stroke="#36285e"/><text x="135" y="84" text-anchor="middle">GNNs</text>
      <rect y="102" width="166" height="24" rx="4" fill="#16112e" stroke="#42307d"/><text x="83" y="118" text-anchor="middle" fill="#a78bfa">HF · QLoRA · OpenCV</text>
    </g>
  </g>

  <!-- STAGE 3: INFRA & FULL-STACK -->
  <g transform="translate(464, 58)">
    <rect width="194" height="198" rx="8" fill="#0c1220" stroke="#1e293b"/>
    <text x="14" y="24" fill="#34d399" font-size="9.5" font-weight="700" letter-spacing="1.3" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">03 // SYSTEMS &amp; WEB</text>
    <line x1="14" y1="33" x2="180" y2="33" stroke="#1e293b"/>
    <g transform="translate(14, 46)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono" font-size="10.5" fill="#e2e8f0">
      <rect width="78" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="39" y="16" text-anchor="middle">FastAPI</text>
      <rect x="86" width="80" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="126" y="16" text-anchor="middle">Docker</text>
      <rect y="34" width="94" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="47" y="50" text-anchor="middle">PostgreSQL</text>
      <rect x="102" y="34" width="64" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="134" y="50" text-anchor="middle">Flask</text>
      <rect y="68" width="84" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="42" y="84" text-anchor="middle">Next.js</text>
      <rect x="92" y="68" width="74" height="24" rx="4" fill="#0c1c1a" stroke="#17443b"/><text x="129" y="84" text-anchor="middle">React</text>
      <rect y="102" width="166" height="24" rx="4" fill="#0a201c" stroke="#1c574a"/><text x="83" y="118" text-anchor="middle" fill="#34d399">Linux · SSH · tmux</text>
    </g>
  </g>

  <!-- STAGE 4: LIVE COMPUTE CLUSTERS (Cross-browser SMIL Bars) -->
  <g transform="translate(690, 58)">
    <rect width="192" height="198" rx="8" fill="#0c1220" stroke="#1e293b"/>
    <text x="14" y="24" fill="#f59e0b" font-size="9.5" font-weight="700" letter-spacing="1.3" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">04 // GPU CLUSTERS</text>
    <line x1="14" y1="33" x2="178" y2="33" stroke="#1e293b"/>

    <text x="14" y="55" fill="#e2e8f0" font-size="10" font-weight="600" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">CMU XULAB · 8× RTX 3090</text>
    <rect x="14" y="63" width="164" height="8" rx="4" fill="#070a10" stroke="#1e293b"/>
    <rect x="15" y="64" width="128" height="6" rx="3" fill="#38bdf8">
      <animate attributeName="width" values="118;156;126;148;118" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <text x="14" y="99" fill="#e2e8f0" font-size="10" font-weight="600" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">SRM DGX · 2× A100 40GB</text>
    <rect x="14" y="107" width="164" height="8" rx="4" fill="#070a10" stroke="#1e293b"/>
    <rect x="15" y="108" width="138" height="6" rx="3" fill="#a78bfa">
      <animate attributeName="width" values="146;104;154;122;146" dur="4.1s" repeatCount="indefinite"/>
    </rect>

    <text x="14" y="143" fill="#e2e8f0" font-size="10" font-weight="600" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">LOCAL DEV · RTX 4050</text>
    <rect x="14" y="151" width="164" height="8" rx="4" fill="#070a10" stroke="#1e293b"/>
    <rect x="15" y="152" width="90" height="6" rx="3" fill="#34d399">
      <animate attributeName="width" values="76;122;88;112;76" dur="2.9s" repeatCount="indefinite"/>
    </rect>

    <text x="14" y="182" fill="#64748b" font-size="9" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">PROXYJUMP · ZERO-2 · DDP</text>
  </g>
</svg>