      <line x1="50" y1="14" x2="84" y2="34" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="18" y1="36" x2="84" y2="34" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" class="ddil-drop"/>
      <line x1="50" y1="14" x2="52" y2="40" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
