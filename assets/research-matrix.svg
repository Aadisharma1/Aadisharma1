      <polygon points="51,10 82,18 51,26 20,18" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="0.9"/>
      <polygon points="51,18 82,26 51,34 20,26" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="0.9"/>
      <polygon points="51,26 82,34 51,42 20,34" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="0.9"/>
      <line x1="16" y1="8" x2="86" y2="8" stroke="#34d399" stroke-width="1.6" class="mri-laser" filter="url(#resGlow)"/>
    </g>
  </g>

