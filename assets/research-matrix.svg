    <text x="18" y="25" fill="#34d399" font-size="10" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">CMU (XULAB) × HARVARD MEDICAL SCHOOL</text>
