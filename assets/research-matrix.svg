    <rect x="0.5" y="14" width="3" height="36" rx="1.5" fill="#38bdf8"/>
    <text x="18" y="25" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">CARNEGIE MELLON UNIVERSITY</text>
    <text x="18" y="47" fill="#f8fafc" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">Continual LLM Safety &amp; Multi-Turn RLVR</text>
    <text x="18" y="69" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">Quantifying safety drift, alignment faking &amp; user-conditioned</text>
    <text x="18" y="86" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">reward hacking across Llama-3.1-8B &amp; Qwen2.5-7B trajectories.</text>
    <text x="18" y="106" fill="#64748b" font-size="10" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">→ Safety-aware verifiers · Replay buffers · ZeRO-2 (2× A100)</text>

    <rect x="18" y="121" width="96" height="21" rx="4" fill="#0f1b2d" stroke="#1e3a5f"/>
    <text x="66" y="135" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">32K CONTEXT</text>
    <rect x="122" y="121" width="110" height="21" rx="4" fill="#0c1f1c" stroke="#14493b"/>
    <text x="177" y="135" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">ASR MITIGATION</text>

    <g transform="translate(324, 14)">
      <rect width="102" height="50" rx="6" fill="#070a10" stroke="#1a2436"/>
      <line x1="8" y1="38" x2="94" y2="38" stroke="#1e293b" stroke-width="0.8"/>
      <line x1="8" y1="14" x2="94" y2="14" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>
      <path d="M 10 36 Q 32 34, 48 26 T 92 10" fill="none" stroke="#f59e0b" stroke-width="1.6" class="drift-line"/>
      <path d="M 10 36 Q 32 37, 52 34 T 92 33" fill="none" stroke="#34d399" stroke-width="1.8" class="safe-line" filter="url(#resGlow)"/>
      <circle cx="92" cy="33" r="2.2" fill="#34d399">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="8" y="47" fill="#475569" font-size="7.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">ASR DRIFT GATE</text>
    </g>
  </g>

