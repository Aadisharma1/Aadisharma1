    <rect x="150" y="121" width="96" height="21" rx="4" fill="#0f1b2d" stroke="#1e3a5f"/>
    <text x="198" y="135" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">14.1× LESS BW</text>

