<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 368" width="900" height="368" role="img" aria-label="Research Operations Matrix">
  <defs>
    <linearGradient id="resCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f18"/>
      <stop offset="100%" stop-color="#0f1524"/>
    </linearGradient>
    <filter id="resGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .drift-line {
      stroke-dasharray: 140;
      stroke-dashoffset: 0;
      animation: drawLoop 4.5s ease-in-out infinite -2.0s;
    }
    .safe-line {
      stroke-dasharray: 140;
      stroke-dashoffset: 0;
      animation: drawLoop 4.5s ease-in-out infinite -1.6s;
    }
    @keyframes drawLoop {
      0% { stroke-dashoffset: 140; opacity: 0.35; }
      45%, 82% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -140; opacity: 0.25; }
    }
    .mri-laser { animation: mriScan 3.4s ease-in-out infinite; }
    @keyframes mriScan { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(34px); } }
    .ddil-drop { animation: linkDrop 2.4s steps(2, end) infinite; }
    @keyframes linkDrop { 0%, 40% { stroke-opacity: 0.15; } 50%, 90% { stroke-opacity: 0.7; } }
    .tok-slide { animation: tokCompress 3.6s ease-in-out infinite; }
    @keyframes tokCompress { 0%, 100% { transform: translateX(0px); opacity: 0.95; } 50% { transform: translateX(24px); opacity: 0.35; } }
  </style>

  <!-- Dual-Theme Dark Header Pill -->
  <rect x="0.5" y="0.5" width="899" height="30" rx="8" fill="#090d16" stroke="#1e293b"/>
  <circle cx="16" cy="15.5" r="3" fill="#38bdf8"/>
  <text x="28" y="19.5" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.8" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">01 // ACTIVE RESEARCH LABS &amp; COLLABORATIONS</text>
  <text x="884" y="19.5" fill="#64748b" font-size="9.5" text-anchor="end" letter-spacing="1.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">LIVE TELEMETRY · 4 TRACKS</text>

  <!-- CARD 1: CMU LLM SAFETY & RLVR -->
  <g transform="translate(0, 42)">
