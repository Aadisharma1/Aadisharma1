    <text x="18" y="47" fill="#f8fafc" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">Homomorphic Attention &amp; Encrypted ML (HEAT)</text>
