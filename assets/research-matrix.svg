      <circle cx="84" cy="34" r="3.2" fill="#34d399"/>
      <circle cx="52" cy="40" r="2.5" fill="#94a3b8"/>
      <!-- Properly anchored relative motion packet (starts on node 18,36!) -->
      <g transform="translate(18,36)">
        <circle cx="0" cy="0" r="2.4" fill="#f59e0b" filter="url(#resGlow)">
          <animateMotion dur="2.1s" repeatCount="indefinite" path="M 0 0 L 32 -22 L 66 -2"/>
        </circle>
      </g>
    </g>
  </g>

