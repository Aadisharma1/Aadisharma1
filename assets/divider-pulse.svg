<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 26" width="900" height="26" role="img" aria-label="Section Divider">
  <defs>
    <linearGradient id="divPulseR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divPulseL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="16" y1="13" x2="884" y2="13" stroke="#1e293b" stroke-width="1"/>
  <line x1="16" y1="9" x2="16" y2="17" stroke="#334155" stroke-width="1.2"/>
  <line x1="884" y1="9" x2="884" y2="17" stroke="#334155" stroke-width="1.2"/>
  <line x1="225" y1="10" x2="225" y2="16" stroke="#1e293b" stroke-width="1"/>
  <line x1="675" y1="10" x2="675" y2="16" stroke="#1e293b" stroke-width="1"/>

  <rect x="450" y="12" width="110" height="2" rx="1" fill="url(#divPulseR)">
    <animate attributeName="x" values="450;884" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="340" y="12" width="110" height="2" rx="1" fill="url(#divPulseL)">
    <animate attributeName="x" values="340;-94" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <polygon points="450,7 456,13 450,19 444,13" fill="#070a10" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="450" cy="13" r="1.8" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>