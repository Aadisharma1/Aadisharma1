<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" role="img" aria-label="Flagship Engineering Systems">
  <defs>
    <linearGradient id="projBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0e1422"/>
    </linearGradient>
    <filter id="projGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Dual-Theme Dark Header Pill -->
  <rect x="0.5" y="0.5" width="899" height="30" rx="8" fill="#090d16" stroke="#1e293b"/>
  <circle cx="16" cy="15.5" r="3" fill="#f59e0b"/>
  <text x="28" y="19.5" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.8" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">02 // ENGINEERED SYSTEMS &amp; INFRASTRUCTURE BUILDS</text>
  <text x="884" y="19.5" fill="#64748b" font-size="9.5" text-anchor="end" letter-spacing="1.2" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">PRODUCTION · SIMULATION · CRYPTO</text>

  <!-- PROJECT 1: VORTEX-GNC -->
  <g transform="translate(0, 42)">
    <rect x="0.5" y="0.5" width="441" height="136" rx="11" fill="url(#projBg)" stroke="#1e293b"/>
    <text x="18" y="26" fill="#f59e0b" font-size="13.5" font-weight="700" letter-spacing="0.8" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">VORTEX-GNC</text>
    <text x="128" y="26" fill="#475569" font-size="10" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">// 6-DOF EO/IR GUIDANCE TESTBED</text>
    <text x="18" y="48" fill="#cbd5e1" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">Aerodynamic 6-DoF missile guidance &amp; spatiotemporal entropy-</text>
    <text x="18" y="65" fill="#cbd5e1" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" class="sans">gated EO/IR seeker simulator with live Three.js telemetry.</text>
    <text x="18" y="88" fill="#34d399" font-size="10.2" font-weight="600" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">★ 74% paired Monte Carlo win rate vs. centroid seekers</text>
    <text x="18" y="114" fill="#64748b" font-size="9.5" letter-spacing="0.8" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" class="mono">PYTHON  ·  ECCM  ·  THREE.JS  ·  MONTE CARLO</text>

    <g transform="translate(384, 68)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#1e293b" stroke-width="1"/>
      <g>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="7 6"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
      </g>
      <line x1="-26" y1="0" x2="-10" y2="0" stroke="#f59e0b" stroke-width="1"/>
      <line x1="10" y1="0" x2="26" y2="0" stroke="#f59e0b" stroke-width="1"/>
      <line x1="0" y1="-26" x2="0" y2="-10" stroke="#f59e0b" stroke-width="1"/>
      <line x1="0" y1="10" x2="0" y2="26" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#f59e0b" filter="url(#projGlow)">
        <animate attributeName="r" values="2.2;4.5;2.2" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

